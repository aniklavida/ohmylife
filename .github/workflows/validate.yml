name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            AGENTS.md
            .gitignore
            docs/SPEC.md
            docs/ARCHITECTURE.md
            docs/STRUCTURE.md
            docs/ROADMAP.md
            docs/RELEASE_CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done

      - name: Reject unresolved merge markers and machine paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|/Users/[^/]+/|/home/[^/]+/|C:\\Users\\|<owner>' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Repository contains a merge marker, machine-specific path, or owner placeholder."
            exit 1
          fi

      - name: Reject common credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            --exclude-dir=.git --exclude=validate.yml .; then
            echo "Potential credential detected."
            exit 1
          fi

      - name: Reject committed personal data and databases
        shell: bash
        run: |
          set -euo pipefail
          # This application stores someone's life in a folder. It must never be
          # committed here, and neither must a database built from one.
          if git ls-files | grep -InE '(^|/)life/|\.sqlite3?$|\.db$'; then
            echo "A life folder or database is tracked in this repository. Remove it."
            exit 1
          fi

  build:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, and fails if package.json and
      # package-lock.json have drifted apart — which is itself worth catching.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
